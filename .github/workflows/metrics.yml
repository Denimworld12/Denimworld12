name: GitHub Metrics

on:
  # Refresh the stats card once a day
  schedule:
    - cron: "0 0 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics SVG
        uses: lowlighter/metrics@v3.34
        with:
          # Personal access token stored as the METRICS_TOKEN repository secret
          token: ${{ secrets.METRICS_TOKEN }}
          user: Denimworld12
          template: classic
          base: header, activity, community, repositories, metadata
          # Rendered file committed to the repository and referenced from README.md
          filename: github-metrics.svg
