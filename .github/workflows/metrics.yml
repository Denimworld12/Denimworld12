name: GitHub Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate profile metrics card
        run: node .github/scripts/generate-metrics-card.js
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit updated card
        run: |
          git config user.name "Denimworld12"
          git config user.email "166978100+Denimworld12@users.noreply.github.com"
          git add github-metrics-dark.svg github-metrics-light.svg
          if git diff --cached --quiet; then
            echo "Metrics card unchanged"
          else
            git commit -m "Update profile metrics card"
            git push
          fi
